<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Prototype Prêts MDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --primary:#0E76B6; --primary-hover:#0B679F; --primary-press:#005898; --primary-soft:#E6F1F9; --on-primary:#FFFFFF;
  --teal:#2DB8C5; --yellow:#FAC422; --yellow-soft:#FEF4D4;
  --bg:#F4F6FA; --surface:#FFFFFF; --sunken:#EEF1F6; --border:#E3E7EE; --border-strong:#CDD3DC;
  --text:#1D1D1B; --text-2:#5A606B; --text-3:#8C929C;
  --success:#16794A; --success-soft:#E3F3EA; --warning:#9A6200; --warning-soft:#FDF1D3; --danger:#C0362C; --danger-soft:#FCEAE8;
  --device:#111418; --demo:#1D1D1B; --demo-2:#2A2B2E; --demo-text:#F3F5FA; --demo-muted:#A7ADB6;
  --sh-xs:0 1px 2px rgba(16,24,40,.06); --sh-sm:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --sh-md:0 12px 32px -8px rgba(16,24,40,.16); --sh-lg:0 32px 64px -16px rgba(16,24,40,.30);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-sheet:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#58AEE2; --primary-hover:#79BFEA; --primary-press:#9BD0F0; --primary-soft:#133148; --on-primary:#06121B;
    --teal:#4CCBD6; --yellow:#F5C84A; --yellow-soft:#372C0E;
    --bg:#0C1117; --surface:#141B23; --sunken:#0F151C; --border:#243040; --border-strong:#334155;
    --text:#E8EDF3; --text-2:#A3ADB9; --text-3:#707A87;
    --success:#6BD19B; --success-soft:#10301F; --warning:#EFC45E; --warning-soft:#382B0C; --danger:#F28B80; --danger-soft:#3A1714;
    --device:#05070A; --demo:#05080C; --demo-2:#161C24;
    --sh-xs:0 1px 2px rgba(0,0,0,.4); --sh-sm:0 1px 3px rgba(0,0,0,.4); --sh-md:0 12px 32px -8px rgba(0,0,0,.55); --sh-lg:0 32px 64px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --primary:#58AEE2; --primary-hover:#79BFEA; --primary-press:#9BD0F0; --primary-soft:#133148; --on-primary:#06121B;
  --teal:#4CCBD6; --yellow:#F5C84A; --yellow-soft:#372C0E;
  --bg:#0C1117; --surface:#141B23; --sunken:#0F151C; --border:#243040; --border-strong:#334155;
  --text:#E8EDF3; --text-2:#A3ADB9; --text-3:#707A87;
  --success:#6BD19B; --success-soft:#10301F; --warning:#EFC45E; --warning-soft:#382B0C; --danger:#F28B80; --danger-soft:#3A1714;
  --device:#05070A; --demo:#05080C; --demo-2:#161C24;
  --sh-xs:0 1px 2px rgba(0,0,0,.4); --sh-sm:0 1px 3px rgba(0,0,0,.4); --sh-md:0 12px 32px -8px rgba(0,0,0,.55); --sh-lg:0 32px 64px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:20px;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.i{flex:none;display:inline-block;vertical-align:middle}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.micro{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shared components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text);box-shadow:var(--sh-xs);transition:background .12s var(--ease),border-color .12s var(--ease)}
.btn:hover{border-color:var(--border-strong);background:var(--sunken)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--sunken);color:var(--text)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.lg{height:48px;padding:0 18px;font-size:15px;border-radius:12px}
.btn.block{width:100%}
.btn.icon{width:36px;padding:0}.btn.icon.sm{width:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-family:var(--f-mono);font-size:11px;line-height:16px;padding:0 5px;border-radius:4px;border:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:16px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:var(--success)} .b-warn{color:var(--warning)} .b-bad{color:var(--danger)} .b-off{color:var(--text-3)} .b-pri{color:var(--primary)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.n1{background:var(--danger-soft);color:var(--danger)} .pill.n2{background:var(--warning-soft);color:var(--warning)} .pill.n3{background:var(--success-soft);color:var(--success)}
.pill.c{background:var(--sunken);color:var(--text-2);border:1px solid var(--border)}
.pill.hot{background:var(--danger);color:#fff;border-color:transparent} .pill.warm{background:var(--yellow);color:#1D1D1B;border-color:transparent}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:12px;width:32px;height:32px}
.avatar.xs{width:22px;height:22px;font-size:10px}.avatar.lg{width:44px;height:44px;font-size:16px}.avatar.xl{width:64px;height:64px;font-size:24px}
.thumb{width:40px;height:40px;border-radius:12px;background:var(--sunken);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);flex:none}
.field{display:grid;gap:6px}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--text-2)}
.input{height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:0 12px;width:100%;font-size:14px}
textarea.input{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:20px}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
select.input{appearance:auto}
.switch{position:relative;width:38px;height:22px;border-radius:999px;background:var(--border-strong);transition:background .2s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh-xs);transition:transform .2s var(--ease)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--sunken);border:1px solid var(--border);border-radius:10px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh-xs)}
.chg{animation:ring 1.2s var(--ease)}
@keyframes ring{0%,60%{box-shadow:0 0 0 3px var(--yellow)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.chg{animation:none}*{animation-duration:.01ms!important;transition:none!important}}

/* ---------- demo bar ---------- */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--demo);color:var(--demo-text)}
.demobar-in{max-width:1560px;margin:0 auto;padding-inline:clamp(12px,2vw,24px);padding-block:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.dm-brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.dm-brand .mark{width:20px;height:20px;border-radius:6px;background:#2DB8C5;position:relative}
.dm-brand .mark::after{content:"";position:absolute;width:9px;height:9px;border-radius:3px;background:#FAC422;right:-3px;bottom:-3px;box-shadow:0 0 0 2px var(--demo)}
.dm-brand b{font-family:var(--f-display);font-size:15px}
.dm-brand .tag{height:20px;padding:0 8px;border-radius:999px;background:#FAC422;color:#1D1D1B;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center}
.dm-seg{display:inline-flex;gap:2px;padding:3px;background:var(--demo-2);border-radius:10px}
.dm-seg button{height:28px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--demo-muted);display:inline-flex;align-items:center;gap:6px}
.dm-seg button[aria-pressed="true"]{background:#F3F5FA;color:#1D1D1B}
.dm-clock{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;background:var(--demo-2);font-family:var(--f-mono);font-size:12px;font-weight:600}
.dm-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:10px;border:1px solid #3A3D42;color:var(--demo-text);font-size:12px;font-weight:600}
.dm-btn:hover{border-color:#F3F5FA}
.dm-btn:disabled{opacity:.4;cursor:not-allowed}
.dm-sep{width:1px;height:22px;background:#3A3D42}
@media (max-width:900px){.dm-lbl{display:none}}

.wrap{max-width:1560px;margin:0 auto;padding-inline:clamp(12px,2vw,24px);padding-block:18px 60px}
.stage{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
.stage.v-app{grid-template-columns:minmax(0,1fr)}.stage.v-app .col-bo{display:none}
.stage.v-bo{grid-template-columns:minmax(0,1fr)}.stage.v-bo .col-app{display:none}
.colhead{display:flex;align-items:center;justify-content:space-between;gap:10px;height:44px;margin-bottom:10px}
.persona-pick{display:flex;gap:4px;padding:3px;background:var(--sunken);border:1px solid var(--border);border-radius:12px}
.persona-pick button{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:9px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap}
.persona-pick button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh-xs)}

/* demo toast */
.dtoast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;width:min(380px,calc(100vw - 32px));background:var(--demo);color:var(--demo-text);border-radius:16px;box-shadow:var(--sh-lg);padding:12px 14px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;animation:rise .28s var(--ease)}
.dtoast[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dtoast .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.dtoast .c.ok{background:#16794A}.dtoast .c.no{background:#C0362C}
.dtoast .m{font-size:13px;line-height:18px}
.dtoast .r{font-family:var(--f-mono);font-size:11px;color:var(--demo-muted);margin-top:4px}
.dtoast button{color:var(--demo-muted)}

/* ---------- PHONE ---------- */
.device{background:var(--device);border-radius:50px;padding:10px;box-shadow:var(--sh-lg);width:100%;max-width:400px;margin-inline:auto}
.screen{position:relative;height:800px;border-radius:40px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
@media (max-width:480px){.device{border-radius:38px;padding:6px}.screen{border-radius:32px;height:760px}}
.sbar{height:50px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;font-family:var(--f-mono);font-size:13px;font-weight:600}
.sbar .island{width:100px;height:28px;border-radius:16px;background:var(--device)}
.sbar .r{text-align:right;font-size:11px;color:var(--text-2)}
.pscroll{flex:1;overflow-y:auto;padding:4px 16px 110px;display:grid;grid-auto-rows:max-content;gap:16px;align-content:start;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.pscroll.nobar{padding-bottom:24px}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.ptitle h3{font-size:28px;line-height:32px;font-weight:800}
.ptitle .sub{font-size:13px;color:var(--text-2);margin-top:2px}
.pnav{display:flex;align-items:center;gap:6px;margin:0 -6px}
.pnav button{display:inline-flex;align-items:center;gap:2px;color:var(--primary);font-weight:600;font-size:15px;padding:6px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:grid;gap:10px}
.status{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;border-radius:16px;padding:12px 14px}
.status .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.status.ok{background:var(--success-soft)}.status.ok .ico{background:var(--success);color:#fff}
.status.bad{background:var(--danger-soft)}.status.bad .ico{background:var(--danger);color:#fff}
.status.night{background:var(--primary-soft)}.status.night .ico{background:var(--primary);color:var(--on-primary)}
.status.warn{background:var(--yellow-soft)}.status.warn .ico{background:var(--yellow);color:#1D1D1B}
.status b{display:block;font-size:14px}.status span{font-size:12px;line-height:16px;color:var(--text-2)}
.psect{display:grid;gap:8px}
.psect-h{display:flex;justify-content:space-between;align-items:baseline}
.psect-h h4{font-family:var(--f-ui);font-size:15px;font-weight:700;letter-spacing:0}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 12px;width:100%;text-align:left}
button.prow:hover{border-color:var(--border-strong)}
.prow .n{font-weight:600;line-height:18px}
.prow .m{font-size:12px;line-height:16px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;margin-top:1px}
.pempty{font-size:13px;color:var(--text-2);padding:16px;border:1px dashed var(--border-strong);border-radius:16px;text-align:center}
.chipsrow{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.chipsrow button{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2)}
.chipsrow button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.searchbox{height:42px;border-radius:12px;background:var(--sunken);border:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text-3)}
.searchbox input{flex:1;border:0;background:transparent;height:100%;font-size:15px;color:var(--text);outline:none;min-width:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;padding:8px 8px 24px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);z-index:3}
.tabbar button{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-3);position:relative}
.tabbar button[aria-selected="true"]{color:var(--primary)}
.tabbar .scan{width:54px;height:54px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--primary) 70%,transparent);margin-top:-24px}
.tabbar .dotn{position:absolute;top:-4px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;font-weight:700;text-align:center}
.toast{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh-md);padding:10px 12px;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:start}
.toast.in{animation:drop .32s var(--ease-sheet)}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.toast .app{width:32px;height:32px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.toast .tt{font-size:12px;font-weight:700;display:flex;gap:6px}.toast .tt span{font-weight:500;color:var(--text-3)}
.toast .tb{font-size:13px;line-height:18px}
.scrim{position:absolute;inset:0;background:rgba(8,12,20,.42);z-index:6;display:flex;align-items:flex-end}
.scrim.in{animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 18px 24px;display:grid;gap:14px}
.scrim.in .sheet{animation:up .32s var(--ease-sheet)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 2px}
.sheet-h{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center}
.sheet-h .thumb{width:48px;height:48px;border-radius:14px}
.sheet-h h4{font-size:18px;line-height:22px;font-weight:700}
.sheet-h .m{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-top:2px}
.forfait{border-radius:14px;background:var(--yellow-soft);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.forfait .amt{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.forfait small{display:block;font-size:12px;color:var(--text-2)}
.check{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:13px;line-height:18px;cursor:pointer}
.check:has(input:checked){border-color:color-mix(in srgb,var(--primary) 40%,var(--border));background:var(--primary-soft)}
.check input{width:18px;height:18px;margin:0;accent-color:var(--primary)}
.stepn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.stepn i{width:20px;height:20px;border-radius:50%;background:var(--text);color:var(--bg);font-style:normal;font-size:11px;display:grid;place-items:center;font-family:var(--f-mono)}
.photo{height:130px;width:100%;border-radius:14px;border:1.5px dashed var(--border-strong);background:var(--sunken);display:grid;place-items:center;color:var(--text-2);font-size:13px;font-weight:600}
.photo>span{display:grid;justify-items:center;gap:6px}
.photo.taken{border-style:solid;border-color:var(--success);color:var(--success);background:linear-gradient(135deg,var(--success-soft),var(--sunken))}
.segfull{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:3px;background:var(--sunken);border-radius:12px;border:1px solid var(--border)}
.segfull button{height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);text-align:center}
.segfull button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh-xs)}
.classes{display:flex;flex-wrap:wrap;gap:6px}
.classes button{flex:1 0 56px;height:34px;border-radius:10px;border:1px solid var(--border);font-weight:600;font-size:13px;background:var(--surface);text-align:center}

function diffKeys(a, b) {
  const s = new Set();
  for (const id in b.items) if (JSON.stringify(a.items[id]) !== JSON.stringify(b.items[id]) || JSON.stringify(a.catalog[id]) !== JSON.stringify(b.catalog[id])) s.add("item:" + id);
  for (const pid in b.people) if (Engine.blockReason(a, pid) !== Engine.blockReason(b, pid)) s.add("person:" + pid);
  if (JSON.stringify(a.incidents) !== JSON.stringify(b.incidents)) s.add("incidents");
  if (JSON.stringify(a.stock) !== JSON.stringify(b.stock)) s.add("stock");
  for (const r in b.rooms) if (JSON.stringify(a.rooms[r]) !== JSON.stringify(b.rooms[r])) s.add("room:" + r);
  return s;
}

  ui.flash = diffKeys(prev, ui.state);
  const n = r.events.find(e => e.kind === "notif" && e.to && e.to.includes(ui.persona));
  if (n) { ui.app.toast = n.id; ui.app.toastNew = true; }

    if (["EMPRUNTER", "PREVENEZ_MOI"].includes(a.type) && (!r.ok || a.type === "PREVENEZ_MOI") && r.rule !== "blocage" && r.rule !== "bureau") { A.push = { kind: "item", id: a.item }; }
    else { A.push = null; A.tab = "home"; }
    if (a.type === "RENDRE" && !r.ok) A.tab = "home";
    ui.narrowTab = "app";
    if (["EMPRUNTER", "RENDRE"].includes(a.type) && r.ok && st.catalog[a.item].niveau === 1) B.screen = "valid";
    if (a.type === "RENDRE" && r.ok && st.catalog[a.item].niveau === 2) B.screen = "photos";
    if (a.type === "SIGNALER") B.screen = "dashboard";
  }
  if (a.by && ["cyrianne", "lydia", "sandrine"].includes(a.by)) {
    B.user = a.by; B.drawer = null; B.modal = null; ui.narrowTab = "bo";
    B.screen = { VALIDER_REMISE: "valid", VALIDER_RETOUR: "valid", CONTROLER_PHOTO: r.ok ? "incidents" : "photos", REMBOURSEMENT: "incidents", AJUSTER_MONTANT: "incidents", DEBLOQUER: "people", VERIFIER_SALLE: "salles", TRAITER_SIGNALEMENT: "incidents", COMPTAGE: "stock", MODIFIER_FORFAIT: "materiel", RETIRER: "materiel", REMETTRE: "materiel" }[a.type] || B.screen;
    if (a.type === "CONTROLER_PHOTO") B.screen = r.ok && a.missing ? "incidents" : "photos";
    if (a.type === "VALIDER_RETOUR" && r.ok && a.missing) B.screen = "incidents";
    if (a.type === "TRAITER_SIGNALEMENT") B.incTab = "reports";
    if (["REMBOURSEMENT", "AJUSTER_MONTANT"].includes(a.type)) B.incTab = r.ok ? "paid" : "due";
    if (a.type === "MODIFIER_FORFAIT") B.drawer = ["item", a.item];
    const inc = a.type === "REMBOURSEMENT" ? st.incidents.find(i => i.id === a.incident) : null;
    const target = inc ? inc.responsibleId : itemLoan && itemLoan.responsibleId;
    if (target && borrowers.includes(target)) { ui.persona = target; A.push = null; A.tab = "home"; A.sheet = null; }
  }
  if (a.type === "FIN_DE_JOURNEE" || a.type === "LENDEMAIN") {
    B.screen = "dashboard"; B.drawer = null;
    const blocked = borrowers.find(pid => Engine.blockReason(st, pid));
    if (blocked) ui.persona = blocked;
    A.push = null; A.tab = "home"; A.sheet = null;
  }
  if (a.type === "FIN_DE_JOURNEE" || a.type === "LENDEMAIN") ui.narrowTab = "app";
  if (window.matchMedia("(max-width:1279px)").matches) ui.view = ui.narrowTab === "bo" ? "bo" : "app";
  const n = r.events.find(e => e.kind === "notif" && e.to && e.to.includes(ui.persona));
  A.toast = n ? n.id : null; A.toastNew = !!n;
}
function playStep() {
  const sc = SCENARIOS.find(x => x.id === SC.id); if (SC.step >= sc.steps.length) return;
  SC.marks.push(ui.history.length);
  let a = sc.steps[SC.step][1];
  if (a.type === "LOGIN_CHARTE") { ui.sessions[a.by] = true; a = { type: "ACCEPTER_CHARTE", by: a.by }; }
  a = resolve(a);
  SC.step++;
  if (SC.step >= sc.steps.length) SC.done[sc.id] = true;
  run(a, { always: r => focusFor(a, r) });
}
function prevStep() {
  if (!SC.step) return;
  const mark = SC.marks.pop();
  while (ui.history.length > mark) { const h = ui.history.pop(); ui.state = h.state; }
  SC.step--;
  const sc = SCENARIOS.find(x => x.id === SC.id);
  if (SC.step === 0 && sc.keepTomOut) ui.sessions.tom = false;
  Object.assign(ui.app, { sheet: null, toast: null }); ui.bo.drawer = null; $("dtoast").hidden = true;
  render();
}
function renderStory() {
  const el = $("story");
  $("modeseg").innerHTML = `<button type="button" data-scmode="guided" aria-pressed="${SC.mode === "guided"}">${ic("flag", 14)}<span class="dm-lbl">Scénarios</span></button><button type="button" data-scmode="free" aria-pressed="${SC.mode === "free"}">${ic("grid", 14)}<span class="dm-lbl">Libre</span></button>`;
  if (SC.mode !== "guided") { el.hidden = true; return; }
  el.hidden = false;
  const idx = SCENARIOS.findIndex(x => x.id === SC.id), sc = SCENARIOS[idx], n = sc.steps.length, fin = SC.step >= n, next = SCENARIOS[idx + 1];
  const cur = !fin && sc.steps[SC.step][1], actor = cur && cur.by;
  const seen = Engine.RULES.filter(([k]) => SC.coverage[k]).length;
  const segs = sc.steps.map((_, i) => `<i class="${i < SC.step ? "done" : i === SC.step ? "now" : ""}"></i>`).join("");
  const pop = SC.picker ? `<div class="popover" role="menu">${SCENARIOS.map((x, i) => `<button class="popitem${SC.done[x.id] ? " done" : ""}" role="menuitem" type="button" data-scen="${x.id}" aria-current="${x.id === sc.id}"><span class="num">${SC.done[x.id] ? ic("check", 14) : i + 1}</span><span><span class="pt">${esc(x.title)}</span><span class="ps">${esc(x.desc)}</span></span><span class="micro">${x.steps.length} ét.</span></button>`).join("")}</div>` : "";
  const rules = SC.rules ? `<div class="popover right" role="dialog" aria-label="Règles vérifiées"><div style="padding:8px 8px 4px;display:flex;justify-content:space-between;align-items:center"><b>${seen} sur 16 règles vérifiées</b><button class="btn ghost sm" type="button" data-screset="1">Remettre à zéro</button></div><ul class="rulelist" style="margin:0;padding:0">${Engine.RULES.map(([k, code, t]) => `<li class="${SC.coverage[k] ? "seen" : ""}"><span class="ck">${SC.coverage[k] ? ic("check", 12) : ""}</span><span class="code">${code}</span><span>${esc(t)}</span><span class="mono t3">${SC.coverage[k] ? "×" + SC.coverage[k] : ""}</span></li>`).join("")}</ul></div>` : "";
  const actorHtml = actor && S().people[actor] ? `<span class="who">${av(actor, "xs")}${esc(S().people[actor].short)} · ${["cyrianne", "lydia", "sandrine"].includes(actor) ? "back-office" : "app mobile"}</span>` : cur ? `<span class="who">${ic("clock", 14)}Horloge</span>` : "";
  el.innerHTML = `
    <button class="picker" type="button" data-scpicker="1" aria-haspopup="menu" aria-expanded="${SC.picker}"><span class="num">${idx + 1}</span><span><span class="pt">${esc(sc.title)}</span><span class="ps">${n} étapes · changer de scénario</span></span>${ic("chevd")}</button>
    <div class="narr">
      <div class="narr-top"><span class="segs" aria-hidden="true">${segs}</span><span class="micro">${fin ? "Terminé" : `Étape ${SC.step + 1} sur ${n}`}</span>${actorHtml}</div>
      ${fin ? `<div style="display:flex;gap:10px;align-items:center"><span class="donebadge">${ic("check")}</span><h2>Scénario terminé. Qu'est-ce qui vous a surpris ?</h2></div>` : `<h2>${esc(sc.steps[SC.step][0])}</h2>`}
      <p class="watch">${ic("info", 14)}<span>${esc(sc.watch)}</span></p>
    </div>
    <div class="story-actions">
      <button class="covchip" type="button" data-scrules="1" aria-expanded="${SC.rules}">${ic("shield", 14)}Règles <b>${seen}/16</b></button>
      <button class="btn ghost" type="button" data-scprev="1" ${SC.step ? "" : "disabled"}>${ic("chevl", 14)}Précédente</button>
      ${fin ? (next ? `<button class="btn primary lg" type="button" data-scen="${next.id}">Scénario suivant ${ic("arrowr", 16)}</button>` : `<button class="btn primary lg" type="button" data-scmode="free">Explorer librement ${ic("arrowr", 16)}</button>`)
            : `<button class="btn primary lg" type="button" data-scnext="1">Étape suivante <span class="kbd">→</span></button>`}
      ${rules}
    </div>${pop}`;
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) { if (SC.picker || SC.rules) { SC.picker = SC.rules = false; renderStory(); } return; }
  const d = t.dataset;
  if (d.scmode) { if (d.scmode === "guided") startScenario(SC.id); else if (SC.mode !== "free") { SC.mode = "free"; SC.picker = SC.rules = false; ui.persona = "ines"; resetAll(true); } return; }
  if (d.scpicker) { SC.picker = !SC.picker; SC.rules = false; renderStory(); return; }
  if (d.scrules) { SC.rules = !SC.rules; SC.picker = false; renderStory(); return; }
  if (d.screset) { SC.coverage = {}; renderStory(); return; }
  if (d.scen) { startScenario(d.scen); return; }
  if (d.scnext) { playStep(); return; }
  if (d.scprev) { prevStep(); return; }
  if ((SC.picker || SC.rules) && !t.closest(".popover")) { SC.picker = SC.rules = false; renderStory(); }
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === "ArrowRight" && !typing && SC.mode === "guided" && !ui.app.sheet && !ui.bo.modal) { e.preventDefault(); playStep(); }
  if (e.key === "ArrowLeft" && !typing && SC.mode === "guided" && !ui.app.sheet && !ui.bo.modal) { e.preventDefault(); prevStep(); }
  if (e.key === "Escape" && (SC.picker || SC.rules)) { SC.picker = SC.rules = false; renderStory(); }
});

if (window.matchMedia('(max-width:1279px)').matches) ui.view = 'app';
startScenario('onboarding');
</script>
