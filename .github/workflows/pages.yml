# Déploiement du prototype sur GitHub Pages.
#
# Le site est servi sous /<dépôt>/ : `VITE_BASE` porte ce préfixe et le routeur
# React s'y cale (`basename`). Pages ne connaît pas les routes d'une application
# à page unique : on copie `index.html` en `404.html` pour que /app, /admin et
# /cote-a-cote répondent aussi en accès direct.
name: Pages

on:
  push:
    branches:
      - main
      - claude/trusting-euler-icah2z
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier avant de publier
        run: |
          npm run lint
          npm run test

      - name: Construire le site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Repli des routes et fichiers Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
